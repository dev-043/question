    .meta{margin-top:12px;color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:center}

    .fade{transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .22s ease}

    // eenvoudige seeded random (xorshift)
    let seed = Math.floor(Math.random()*2**31);
    function xorshift(){
      seed ^= seed << 13;
      seed ^= seed >>> 17;
      seed ^= seed << 5;
      return Math.abs(seed) / 0x7fffffff;
    }

    function pickRandom(){
      if(pool.length === 0) return null;
      const i = Math.floor(xorshift() * pool.length);
      const q = pool.splice(i,1)[0];
      return q;
    }

      if(!q) {

        questionEl.style.opacity = 1; questionEl.style.transform = 'translateY(0)';
        questionEl.classList.add('big');
      }, 160);
      setCounts();
    }

    document.getElementById('addBtn').addEventListener('click', ()=>{
      const area = document.getElementById('addArea');
      area.style.display = area.style.display === 'none' ? 'block' : 'none';
      document.getElementById('newQuestionInput').focus();
    });

    document.getElementById('newQuestionInput').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        const v = e.target.value.trim();
        if(!v){ e.target.value = ''; return; }
        QUESTIONS.push(v);
        pool.push(v);
        setCounts();
        e.target.value = '';
        document.getElementById('addArea').style.display = 'none';
      }
    });

    // initialisatie
    seedEl.textContent = seed;
    setCounts();
  </script>
</body>
</html>
